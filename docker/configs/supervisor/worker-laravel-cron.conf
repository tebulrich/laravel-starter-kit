[program:laravel-cron]
process_name=%(program_name)s_%(process_num)02d
command=php -dxdebug.mode=off /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/cron.log
stopwaitsecs=1800
priority=3
startretries=30
