[program:composer-install]
command=/bin/bash -c "echo 'Installing Composer dependencies...'; mkdir -p /var/www/html/vendor && composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader"
priority=0
autostart=false
autorestart=false
startretries=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
