[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
memory_limit = 512M

; Caddy already compresses (zstd/br/gzip). PHP zlib can emit output before
; frankenphp_handle_request() and fail Octane worker boot.
zlib.output_compression = Off
zend.exception_ignore_args = Off
expose_php = Off
