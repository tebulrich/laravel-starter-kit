[PHP]
post_max_size = 100M
upload_max_filesize = 100M
variables_order = EGPCS
memory_limit = 512M

; Caddy already compresses (zstd/br/gzip). PHP zlib can emit output before
; frankenphp_handle_request() and fail Octane worker boot.
zlib.output_compression = Off
expose_php = Off

; Nov 2026 PHP security mitigations (until 8.5.13+)
session.upload_progress.enabled = 0
fatal_error_backtraces = 0
zend.exception_ignore_args = 1
