# Project pipeline for the Laravel starter kit.
# Optional Argo trigger and notify jobs live in .gitlab-ci-common.yml.
# Set DEPLOY_* and registry variables in GitLab CI/CD before enabling image builds.

include:
  - local: ".gitlab-ci-common.yml"

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $DEPLOY_ARGO_ENABLED != "1" && $DEPLOY_ARGO_ENABLED != "true"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE
  CI_IMAGE_TAG: ci_$CI_COMMIT_SHORT_SHA
  DEPLOY_APP_NAME: $CI_PROJECT_NAME
  CI_IMAGE_NAME: $IMAGE_TAG:$CI_IMAGE_TAG
  DEPLOY_CI_COMMON_REF: "main"

stages:
  - install-dependencies
  - code-quality
  - build-branch-image
  - ci-common

.clone_ci_common: &clone_ci_common
  - |
    [ "${DEPLOY_CI_COMMON_INSECURE:-}" = "1" ] || [ "${DEPLOY_CI_COMMON_INSECURE:-}" = "true" ] || [ "${DEPLOY_GITLAB_API_INSECURE:-}" = "1" ] || [ "${DEPLOY_GITLAB_API_INSECURE:-}" = "true" ] && export GIT_SSL_NO_VERIFY=1
    [ -z "${DEPLOY_CI_COMMON_REPO_URL:-}" ] && { echo "ERROR: DEPLOY_CI_COMMON_REPO_URL is required." >&2; exit 1; }
    COMMON_URL="${DEPLOY_CI_COMMON_REPO_URL}"
    case "$COMMON_URL" in https://*@*) ;; *) COMMON_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${COMMON_URL#https://}" ;; esac
    if [ ! -d ci-common ]; then
      git clone --depth 1 --branch "${DEPLOY_CI_COMMON_REF}" "$COMMON_URL" ci-common
    fi

.ci_common_before_script:
  before_script:
    - apk add --no-cache curl jq
    - *clone_ci_common

.ci_common_setup:
  image: alpine/git:latest
  before_script:
    - apk add --no-cache bash openssh-client gettext curl jq ca-certificates
    - *clone_ci_common

.php_base: &php_base
  image: dunglas/frankenphp:1.12.7-php8.5-alpine

.php_system_packages: &php_system_packages
  - apk add --no-cache git curl bash unzip icu-dev libzip-dev oniguruma-dev $PHPIZE_DEPS
  - install-php-extensions intl pcntl pdo_mysql pdo_pgsql pdo_sqlite zip

.composer_install: &composer_install
  - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  - composer install --no-interaction --prefer-dist --optimize-autoloader

# vendor must reach Kaniko; storage/ may be ignored but Dockerfile must recreate the tree.
.assert_docker_context: &assert_docker_context
  - chmod +x scripts/ci/assert-docker-context.sh
  - ./scripts/ci/assert-docker-context.sh

install-dependencies:
  <<: *php_base
  stage: install-dependencies
  before_script:
    - *php_system_packages
    - *composer_install
  script:
    - test -f vendor/autoload.php
    - *assert_docker_context
  artifacts:
    paths:
      - vendor/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

.laravel_pint:
  <<: *php_base
  stage: code-quality
  needs: ["install-dependencies"]
  before_script:
    - *php_system_packages
  script:
    - chmod +x scripts/pint.sh
    - ./scripts/pint.sh --dry-run
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

laravel-pint:
  extends: .laravel_pint

laravel-rector:
  <<: *php_base
  stage: code-quality
  needs: ["install-dependencies"]
  before_script:
    - *php_system_packages
  script:
    - chmod +x scripts/rector.sh
    - ./scripts/rector.sh --dry-run
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

laravel-phpstan:
  <<: *php_base
  stage: code-quality
  needs: ["install-dependencies"]
  before_script:
    - *php_system_packages
  script:
    - chmod +x scripts/phpstan.sh
    - ./scripts/phpstan.sh --dry-run
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

laravel-pest:
  <<: *php_base
  stage: code-quality
  needs: ["install-dependencies"]
  before_script:
    - *php_system_packages
  script:
    - chmod +x scripts/phpunit.sh
    - ./scripts/phpunit.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

scripts-qa:
  <<: *php_base
  stage: code-quality
  needs: []
  before_script:
    - apk add --no-cache bash git tar
  script:
    - chmod +x scripts/tests/*.test.sh
    - ./scripts/tests/code-security-runtime.test.sh
    - ./scripts/tests/require-setup.test.sh
    - ./scripts/tests/create-app.test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

shellcheck:
  stage: code-quality
  image:
    name: koalaman/shellcheck-alpine:stable
    entrypoint: [""]
  needs: []
  script:
    - find scripts docker/php -name '*.sh' -print0 | xargs -0 shellcheck -S warning
    - shellcheck -S warning start.sh stop.sh bin/setup bin/create-app
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

# Semgrep / Syft / Trivy need Docker. DinD + FrankenPHP host for Composer SCA.
code-security:
  stage: code-quality
  image: dunglas/frankenphp:1.12.7-php8.5-alpine
  services:
    - name: docker:27-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  needs: []
  before_script:
    - *php_system_packages
    - apk add --no-cache docker-cli
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - chmod +x scripts/code-security.sh
    - ./scripts/code-security.sh check
    - ./scripts/code-security.sh sbom
    - ./scripts/code-security.sh image-scan
  artifacts:
    when: always
    paths:
      - qa/semgrep/reports/
      - qa/gitleaks/reports/
      - qa/sbom/reports/
      - qa/trivy/reports/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

# Runs when Vue was scaffolded as monolith under frontend/.
frontend-qa:
  stage: code-quality
  image: node:24-alpine
  needs: []
  cache:
    key:
      files:
        - frontend/yarn.lock
    paths:
      - frontend/node_modules/
  before_script:
    - corepack enable
  script:
    - cd frontend
    - yarn install --frozen-lockfile
    - yarn qa
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
      exists:
        - frontend/package.json
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists:
        - frontend/package.json
    - if: $CI_PIPELINE_SOURCE == "web"
      exists:
        - frontend/package.json

