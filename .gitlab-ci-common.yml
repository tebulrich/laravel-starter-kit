# Shared Argo trigger + notify jobs. Included from .gitlab-ci.yml.
# Enable with CI/CD variable DEPLOY_ARGO_ENABLED=1 (and DEPLOY_* / Sentry vars as needed).

variables:
  DEPLOY_CI_COMMON_REF: "main"

trigger-argo-update-staging:
  stage: ci-common
  image: alpine/git:latest
  before_script: !reference [.ci_common_before_script, before_script]
  rules:
    - if: ($DEPLOY_ARGO_ENABLED == "1" || $DEPLOY_ARGO_ENABLED == "true") && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
    - if: ($DEPLOY_ARGO_ENABLED == "1" || $DEPLOY_ARGO_ENABLED == "true") && $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "develop"
  script:
    - . ./ci-common/.gitlab/scripts/ci/ci-require-vars.sh DEPLOY_ARGO_PROJECT_ID
    - export BACKEND_SHORT_SHA="${CI_COMMIT_SHORT_SHA}"
    - export BACKEND_SHA="${CI_COMMIT_SHA}"
    - . ./ci-common/.gitlab/scripts/trigger/trigger-argo-update-staging.sh
    - . ./ci-common/.gitlab/scripts/ci/ci-pipeline-feedback.sh "trigger-argo-update-staging" "success"

trigger-argo-branch-instance:
  stage: ci-common
  image: alpine/git:latest
  before_script: !reference [.ci_common_before_script, before_script]
  rules:
    - if: ($DEPLOY_ARGO_ENABLED == "1" || $DEPLOY_ARGO_ENABLED == "true") && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != "main"
  script:
    - . ./ci-common/.gitlab/scripts/ci/ci-require-vars.sh DEPLOY_ARGO_PROJECT_ID
    - . ./ci-common/.gitlab/scripts/trigger/trigger-argo-branch-instance.sh
    - . ./ci-common/.gitlab/scripts/ci/ci-pipeline-feedback.sh "trigger-argo-branch-instance" "success"

notify-sentry-release:
  stage: ci-common
  image: getsentry/sentry-cli:latest
  allow_failure: true
  rules:
    - if: ($DEPLOY_ARGO_ENABLED == "1" || $DEPLOY_ARGO_ENABLED == "true") && $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl jq git
    - |
      [ "${DEPLOY_CI_COMMON_INSECURE:-}" = "1" ] || [ "${DEPLOY_CI_COMMON_INSECURE:-}" = "true" ] || [ "${DEPLOY_GITLAB_API_INSECURE:-}" = "1" ] || [ "${DEPLOY_GITLAB_API_INSECURE:-}" = "true" ] && export GIT_SSL_NO_VERIFY=1
      [ -z "${DEPLOY_CI_COMMON_REPO_URL:-}" ] && { echo "ERROR: DEPLOY_CI_COMMON_REPO_URL is required." >&2; exit 1; }
      COMMON_URL="${DEPLOY_CI_COMMON_REPO_URL}"
      case "$COMMON_URL" in https://*@*) ;; *) COMMON_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${COMMON_URL#https://}" ;; esac
      if [ ! -d ci-common ]; then git clone --depth 1 --branch "${DEPLOY_CI_COMMON_REF}" "$COMMON_URL" ci-common; fi
  script:
    - . ./ci-common/.gitlab/scripts/notify/notify-sentry-release.sh
    - . ./ci-common/.gitlab/scripts/ci/ci-pipeline-feedback.sh "notify-sentry-release" "success"
